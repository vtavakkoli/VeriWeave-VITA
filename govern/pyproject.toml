[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veriweave-govern"
version = "0.1.0"
description = "Policy enforcement and evidence governance control plane for enterprise AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Vahid Tavakkoli"}]
keywords = ["ai-governance", "agentic-ai", "policy-as-code", "audit", "evidence", "human-oversight"]
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "httpx>=0.28,<1",
  "ruff>=0.12,<1",
]

[project.scripts]
veriweave-govern = "app.main:run"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
